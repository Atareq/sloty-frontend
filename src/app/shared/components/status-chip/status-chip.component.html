<span
  class="sloty-status"
  [class.sloty-status-neutral]="tone() === 'neutral'"
  [class.sloty-status-hold]="tone() === 'hold'"
  [class.sloty-status-confirmed]="tone() === 'confirmed'"
  [class.sloty-status-completed]="tone() === 'completed'"
  [class.sloty-status-cancelled]="tone() === 'cancelled'"
  [class.sloty-status-no-show]="tone() === 'no-show'"
  [class.sloty-status-expired]="tone() === 'expired'"
>
  {{ label() }}
</span>
