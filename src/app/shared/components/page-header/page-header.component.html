<header class="space-y-2">
  @if (eyebrow()) {
    <p class="text-sm font-bold text-[var(--sloty-primary)]">{{ eyebrow() }}</p>
  }

  <h1 class="text-2xl font-black leading-tight text-[var(--sloty-text)] sm:text-3xl">
    {{ title() }}
  </h1>

  @if (description()) {
    <p class="max-w-2xl text-sm leading-7 text-[var(--sloty-muted)] sm:text-base">
      {{ description() }}
    </p>
  }
</header>
