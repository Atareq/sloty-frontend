<section class="flex flex-1 items-center justify-center py-8">
  <div class="w-full max-w-md">
    <div class="mb-6 space-y-2 text-center sm:text-right">
      <p class="text-sm font-bold text-[var(--sloty-primary)]">Sloty</p>
      <h1 class="text-2xl font-black text-[var(--sloty-text)]">تسجيل الدخول</h1>
      <p class="text-sm leading-7 text-[var(--sloty-muted)]">
        واجهة أولية لتسجيل دخول فريق الملعب. الربط الحقيقي مع الخادم سيتم في سبرنت لاحق.
      </p>
    </div>

    <app-card padding="lg">
      <!--
        The form is intentionally a skeleton: it defines the fields and local
        validation shape without pretending that a backend login endpoint exists.
      -->
      <form class="space-y-5" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div>
          <label class="sloty-label" for="identifier">رقم الهاتف أو اسم المستخدم</label>
          <input
            class="sloty-input"
            id="identifier"
            type="text"
            formControlName="identifier"
            autocomplete="username"
            placeholder="مثال: 01000000000"
          />

          @if (identifierInvalid) {
            <p class="sloty-field-error">هذا الحقل مطلوب.</p>
          }
        </div>

        <div>
          <label class="sloty-label" for="password">كلمة المرور</label>
          <input
            class="sloty-input"
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="أدخل كلمة المرور"
          />

          @if (passwordInvalid) {
            <p class="sloty-field-error">كلمة المرور مطلوبة.</p>
          }
        </div>

        <app-button type="submit" fullWidth [disabled]="loginForm.invalid">
          دخول
        </app-button>
      </form>
    </app-card>
  </div>
</section>
